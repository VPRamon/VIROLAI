[package]
name = "PhD"
version = "0.1.0"
edition = "2024"

[lib]
name = "scheduler"
path = "src/lib.rs"

[[bin]]
name = "scheduler"
path = "src/main.rs"

[[bin]]
name = "ctao_adapter"
path = "scripts/ctao_adapter.rs"

[dependencies]
siderust      = { path = "siderust" }
qtty          = "0.4.1"
tempoch       = "=0.4.0"
petgraph      = "0.8"
thiserror     = "2.0"
rayon         = "1.10"
log           = "0.4"
env_logger    = "0.11"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[dev-dependencies]
