[package]
name = "PhD"
version = "0.1.0"
edition = "2024"

[lib]
name = "scheduler"
path = "src/lib.rs"

[[bin]]
name = "scheduler"
path = "src/main.rs"

[[bin]]
name = "ctao_adapter"
path = "scripts/ctao_adapter.rs"

[[bin]]
name = "phd_tsi_server"
path = "webapp/scripts/phd_tsi_server.rs"


[[bin]]
name = "phd"
path = "src/bin/phd.rs"

[dependencies]
siderust      = { path = "siderust" }
qtty          = "0.4.1"
tempoch       = "=0.4.0"
chrono        = "0.4"
petgraph      = "0.8"
thiserror     = "2.0"
rayon         = "1.10"
log           = "0.4"
env_logger    = "0.11"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
anyhow        = "1.0"
axum          = "0.8"
tokio         = { version = "1", features = ["full"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tsi-rust      = { path = "webapp/TSI/backend", default-features = false, features = ["postgres-repo", "http-server"] }
csv           = "1.3"
rand          = "0.8"
async-stream  = "0.3"
futures       = "0.3"
libc          = "0.2"
clap          = { version = "4.5", features = ["derive"] }
sha2          = "0.10"
uuid          = { version = "1.10", features = ["v4", "serde"] }
ureq          = { version = "2.10", features = ["json"] }
tempfile        = "3.15"

[dev-dependencies]
tower           = { version = "0.5", features = ["util"] }
http-body-util  = "0.1"
