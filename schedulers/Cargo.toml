[package]
name = "schedulers"
version = "0.1.0"
edition = "2024"

[lib]
name = "schedulers"
path = "src/lib.rs"

[[bin]]
name = "schedulers"
path = "src/main.rs"

[dependencies]
siderust      = { path = "../siderust" }
qtty          = "0.4.1"
tempoch       = "=0.4.0"
chrono        = "0.4"
petgraph      = "0.8"
thiserror     = "2.0"
rayon         = "1.10"
log           = "0.4"
env_logger    = "0.11"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
rand          = "0.8"
sha2          = "0.10"
uuid          = { version = "1.10", features = ["v4", "serde"] }
