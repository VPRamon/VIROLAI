[package]
name = "webapp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "webapp"
path = "src/main.rs"

[dependencies]
schedulers     = { path = "../schedulers" }
tsi-rust       = { path = "TSI/backend", default-features = false, features = ["postgres-repo", "http-server"] }
anyhow         = "1.0"
async-stream   = "0.3"
axum           = "0.8"
chrono         = "0.4"
futures        = "0.3"
rayon          = "1.10"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
sha2           = "0.10"
thiserror      = "2.0"
tokio          = { version = "1", features = ["full"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid           = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile       = "3.15"
tower          = { version = "0.5", features = ["util"] }
