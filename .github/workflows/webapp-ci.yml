name: webapp-ci

on:
  push:
    branches: [main, gaps]
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-ci.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-ci.yml'

# Cancel superseded runs on the same ref so PR pushes don't queue.
concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: TSI backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/TSI/backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: webapp/TSI/backend
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --lib --no-default-features --features local-repo,http-server -- -D warnings
      - name: cargo test
        run: cargo test --lib --no-default-features --features local-repo,http-server

  frontend:
    name: TSI frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/TSI/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/TSI/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: type-check
        run: npm run type-check
      - name: tests
        run: npm run test:run

  docker-smoke:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build docker images
        run: |
          cd webapp/docker
          docker compose build --pull
      - name: Boot stack
        run: |
          cd webapp/docker
          docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v1/_health 2>/dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose -f webapp/docker/docker-compose.yml logs --tail=200 || true
          exit 1
      - name: Tear down
        if: always()
        run: |
          cd webapp/docker
          docker compose down -v
