[package]
name = "experiments"
version = "0.1.0"
edition = "2024"
description = "Experiment runner for the PhD scheduling workspace — runs parameter sweeps against the scheduler library and writes structured output artifacts."

[lib]
name = "experiments"
path = "src/lib.rs"

[[bin]]
name = "experiments"
path = "src/main.rs"

[dependencies]
scheduler      = { path = "..", package = "PhD" }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
rayon          = "1.10"
chrono         = "0.4"
log            = "0.4"
env_logger     = "0.11"
tempfile       = "3.15"
clap           = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.15"
csv      = "1.3"
